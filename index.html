<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>White News</title>
<meta name="description" content="White News — последние новости и публикации">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://challenges.cloudflare.com;
  style-src 'self' 'unsafe-inline';
  img-src 'self' https: data: blob:;
  connect-src 'self' https://ppgrmofgafqwmhdpequt.supabase.co https://challenges.cloudflare.com;
  font-src 'self';
  frame-src https://challenges.cloudflare.com;
  object-src 'none';
  base-uri 'none';
  form-action 'none';
  frame-ancestors 'none';
  upgrade-insecure-requests;
">
<!--
  ПРИМЕЧАНИЕ ПО CSP:
  'unsafe-inline' в script-src и style-src оставлен только потому,
  что весь код встроен в HTML. Для продакшена лучше вынести в app.js / style.css.

  SRI: замените integrity на реальный хэш из https://www.srihash.org/
  для https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js
-->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>

<style>
:root{
  --bg-primary:#0a0e1a;--bg-secondary:#0f1729;--bg-card:#131c31;--bg-hover:#1a2540;
  --border:#1e2a4a;--accent:#2563eb;--accent-hover:#3b82f6;--accent-glow:rgba(37,99,235,.3);
  --text-primary:#e8edf7;--text-secondary:#8b98b8;--success:#16a34a;--danger:#f87171;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg-primary);color:var(--text-primary);min-height:100vh;line-height:1.6;
  background-image:
    radial-gradient(ellipse at top,rgba(37,99,235,.15),transparent 60%),
    radial-gradient(ellipse at bottom,rgba(37,99,235,.08),transparent 60%);
  background-attachment:fixed;
}
.header{
  position:sticky;top:0;z-index:100;background:rgba(10,14,26,.85);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:1rem 1.5rem;
}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.logo{
  font-size:1.4rem;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:.5rem;
  cursor:pointer;background:none;border:none;color:inherit;font-family:inherit;padding:0;
}
.logo span{color:var(--accent)}
.logo::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.nav{display:flex;gap:.75rem;align-items:center}
.nav-btn{
  background:transparent;border:1px solid var(--border);color:var(--text-primary);
  padding:.55rem 1rem;border-radius:8px;font-size:.85rem;font-weight:600;
  cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap;
}
.nav-btn:hover{background:var(--bg-hover);border-color:var(--accent)}
.nav-btn.primary{background:var(--accent);border-color:var(--accent)}
.nav-btn.primary:hover{background:var(--accent-hover)}
.container{max-width:1200px;margin:0 auto;padding:2rem 1.5rem 4rem}
.page-title{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:800;margin-bottom:.5rem;letter-spacing:-1px}
.page-subtitle{color:var(--text-secondary);margin-bottom:2rem}
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem}
.news-card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:14px;overflow:hidden;
  transition:all .25s;display:flex;flex-direction:column;cursor:pointer;
}
.news-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 0 1px var(--accent)}
.news-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.news-card-image{width:100%;height:200px;object-fit:cover;background:var(--bg-secondary);display:block}
.news-card-body{padding:1.25rem;display:flex;flex-direction:column;flex:1}
.news-card-date{font-size:.75rem;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.5rem}
.news-card-title{font-size:1.15rem;font-weight:700;margin-bottom:.6rem;line-height:1.3;word-break:break-word}
.news-card-content{
  color:var(--text-secondary);font-size:.92rem;flex:1;white-space:pre-wrap;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
}
.news-card-footer{
  display:flex;align-items:center;justify-content:space-between;margin-top:1rem;padding-top:1rem;
  border-top:1px solid var(--border);font-size:.8rem;color:var(--text-secondary);
}
.news-card-readmore{color:var(--accent);font-weight:600;font-size:.85rem}

.article-view{display:none}
.article-view.active{display:block}
.article-back{
  background:transparent;border:1px solid var(--border);color:var(--text-primary);
  padding:.55rem 1rem;border-radius:8px;font-size:.85rem;font-weight:600;
  cursor:pointer;transition:all .2s;font-family:inherit;margin-bottom:1.5rem;
}
.article-back:hover{background:var(--bg-hover);border-color:var(--accent)}
.article-header{margin-bottom:2rem}
.article-meta{font-size:.85rem;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.75rem}
.article-title{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;margin-bottom:1rem;letter-spacing:-.5px;line-height:1.2}
.article-author{color:var(--text-secondary);font-size:.9rem}
.article-image{width:100%;max-height:500px;object-fit:cover;border-radius:14px;margin-bottom:2rem}
.article-content{font-size:1.05rem;line-height:1.8;white-space:pre-wrap;word-break:break-word;color:var(--text-primary)}

.propose-form-wrap{display:none;max-width:700px;margin:0 auto}
.propose-form-wrap.active{display:block}
.form-group{margin-bottom:1.2rem}
.form-label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.5rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px}
.form-control{
  width:100%;padding:.75rem 1rem;background:var(--bg-secondary);border:1px solid var(--border);
  border-radius:8px;color:var(--text-primary);font-size:.95rem;font-family:inherit;transition:all .2s;
}
.form-control:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
textarea.form-control{resize:vertical;min-height:180px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.75rem 1.5rem;
  border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:.9rem;font-weight:600;
  cursor:pointer;transition:all .2s;font-family:inherit;width:100%;
}
.btn:hover{background:var(--accent-hover);box-shadow:0 0 20px var(--accent-glow)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.hp-field{position:absolute!important;left:-10000px!important;width:1px;height:1px;overflow:hidden}
#turnstile-container{min-height:65px}

.empty-state,.loading-state{text-align:center;padding:4rem 1rem;color:var(--text-secondary)}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.alert{padding:.75rem 1rem;border-radius:8px;font-size:.9rem;margin-bottom:1rem;display:none}
.alert.active{display:block}
.alert-error{background:rgba(220,38,38,.15);color:#f87171;border:1px solid rgba(220,38,38,.3)}
.alert-success{background:rgba(22,163,74,.15);color:#4ade80;border:1px solid rgba(22,163,74,.3)}
.hidden{display:none!important}
.text-error{color:var(--danger)}

@media (max-width:768px){
  .header{padding:.85rem 1rem}
  .logo{font-size:1.15rem}
  .nav-btn{padding:.45rem .7rem;font-size:.78rem}
  .container{padding:1.5rem 1rem 3rem}
  .news-grid{grid-template-columns:1fr;gap:1rem}
  .article-title{font-size:1.5rem}
  .article-content{font-size:1rem}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <button class="logo" type="button" id="logoBtn">White<span>News</span></button>
    <nav class="nav">
      <button class="nav-btn" type="button" id="feedBtn">Лента</button>
      <button class="nav-btn primary" type="button" id="proposeBtn">Предложить статью</button>
    </nav>
  </div>
</header>

<main class="container">

  <section id="feedView" class="feed-view">
    <h1 class="page-title">Последние новости</h1>
    <p class="page-subtitle">Свежие публикации от White News</p>
    <div id="newsContainer" class="news-grid"></div>
    <div id="loading" class="loading-state">
      <div class="spinner"></div>
      <p>Загрузка новостей...</p>
    </div>
    <div id="empty" class="empty-state hidden">
      <p>📭 Пока нет новостей</p>
    </div>
  </section>

  <section id="articleView" class="article-view">
    <button class="article-back" type="button" id="backBtn">← Назад к ленте</button>
    <div id="articleContent"></div>
  </section>

  <section id="proposeView" class="propose-form-wrap">
    <h1 class="page-title">Предложить статью</h1>
    <p class="page-subtitle">Отправьте новость на модерацию — после одобрения она появится в ленте</p>

    <div id="proposeAlert" class="alert" role="alert" aria-live="polite"></div>

    <form id="proposeForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="pTitle">Заголовок *</label>
        <input type="text" class="form-control" id="pTitle" name="title"
               required minlength="3" maxlength="200"
               autocomplete="off" placeholder="О чём ваша новость?">
      </div>
      <div class="form-group">
        <label class="form-label" for="pContent">Текст статьи *</label>
        <textarea class="form-control" id="pContent" name="content"
                  required minlength="10" maxlength="20000"
                  placeholder="Расскажите подробнее..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="pImage">URL картинки (необязательно)</label>
        <input type="url" class="form-control" id="pImage" name="image_url"
               maxlength="500" autocomplete="off" placeholder="https://...">
      </div>
      <div class="form-group">
        <label class="form-label" for="pAuthor">Ваше имя</label>
        <input type="text" class="form-control" id="pAuthor" name="author"
               maxlength="100" autocomplete="off" placeholder="Как вас подписать?">
      </div>

      <!-- Honeypot -->
      <div class="hp-field" aria-hidden="true">
        <label for="pWebsite">Website</label>
        <input type="text" id="pWebsite" name="website" tabindex="-1" autocomplete="off">
      </div>

      <!-- Turnstile -->
      <div class="form-group">
        <div id="turnstile-container"></div>
      </div>

      <button type="submit" class="btn" id="pSubmit">Отправить на модерацию</button>
    </form>
  </section>

</main>

<script>
'use strict';

// ================== НАСТРОЙКИ ==================
const SUPABASE_URL = 'https://ppgrmofgafqwmhdpequt.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Ngb4i_VLSAW5ac1VmOO9GA_q-ErQLKt';
const SUBMIT_ENDPOINT = SUPABASE_URL + '/functions/v1/smart-handler';
const TURNSTILE_SITE_KEY = '0x4AAAAAAAe-bdCPRuFJJ1kuB';
// ===============================================

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const RATE_KEY = 'wn_propose_times';
const RATE_MAX = 3;
const RATE_WINDOW_MS = 60 * 60e3;
const MIN_FILL_TIME_MS = 3000;

let allNews = [];
let formOpenedAt = Date.now();
let turnstileToken = null;
let turnstileWidgetId = null;

// ---------- Утилиты ----------
function formatDate(iso){
  const d = new Date(iso);
  if(Number.isNaN(d.getTime())) return '';
  return d.toLocaleDateString('ru-RU',{
    day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'
  });
}

// Разрешаем только абсолютные https:// URL
function safeHttpsUrl(raw){
  if(!raw || typeof raw !== 'string') return null;
  const trimmed = raw.trim();
  if(!trimmed) return null;
  try{
    const u = new URL(trimmed);
    if(u.protocol === 'https:') return u.href;
  }catch(_){}
  return null;
}

function el(tag, attrs = {}, children = []){
  const node = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(v === null || v === undefined) continue;
    if(k === 'class') node.className = v;
    else if(k === 'text') node.textContent = v;
    else if(k === 'dataset') Object.assign(node.dataset, v);
    else if(k.startsWith('on') && typeof v === 'function'){
      node.addEventListener(k.slice(2).toLowerCase(), v);
    } else {
      node.setAttribute(k, v);
    }
  }
  for(const c of [].concat(children)){
    if(c === null || c === undefined) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}

function makeImage(src, className, alt = ''){
  const safe = safeHttpsUrl(src);
  if(!safe) return null;
  const img = el('img', {
    src: safe, alt, class: className, loading: 'lazy',
    referrerpolicy: 'no-referrer', decoding: 'async'
  });
  img.addEventListener('error', () => { img.remove(); });
  return img;
}

// ---------- Переключение видов ----------
const feedView    = document.getElementById('feedView');
const articleView = document.getElementById('articleView');
const proposeView = document.getElementById('proposeView');
const feedBtn     = document.getElementById('feedBtn');
const proposeBtn  = document.getElementById('proposeBtn');

function showFeed(){
  feedView.classList.remove('hidden');
  articleView.classList.remove('active');
  proposeView.classList.remove('active');
  feedBtn.classList.add('primary');
  proposeBtn.classList.remove('primary');
  window.scrollTo(0,0);
}

function showPropose(){
  feedView.classList.add('hidden');
  articleView.classList.remove('active');
  proposeView.classList.add('active');
  proposeBtn.classList.add('primary');
  feedBtn.classList.remove('primary');
  formOpenedAt = Date.now();
  window.scrollTo(0,0);
}

function showArticle(id){
  const n = allNews.find(x => String(x.id) === String(id));
  if(!n) return;

  feedView.classList.add('hidden');
  proposeView.classList.remove('active');
  articleView.classList.add('active');
  feedBtn.classList.remove('primary');

  const container = document.getElementById('articleContent');
  container.replaceChildren();

  container.appendChild(el('div', {class:'article-header'}, [
    el('div', {class:'article-meta', text: formatDate(n.created_at)}),
    el('h1',  {class:'article-title', text: n.title || ''}),
    el('div', {class:'article-author', text: '✍️ ' + (n.author || 'White News')})
  ]));

  const img = makeImage(n.image_url, 'article-image');
  if(img) container.appendChild(img);

  container.appendChild(el('div', {class:'article-content', text: n.content || ''}));
  window.scrollTo(0,0);
}

// ---------- Рендер ленты ----------
function buildCard(n){
  const card = el('article', {
    class: 'news-card', tabindex: '0', role: 'button',
    'aria-label': 'Открыть статью: ' + (n.title || ''),
    dataset: {id: String(n.id)}
  });

  const img = makeImage(n.image_url, 'news-card-image');
  if(img) card.appendChild(img);

  card.appendChild(el('div', {class:'news-card-body'}, [
    el('div', {class:'news-card-date',  text: formatDate(n.created_at)}),
    el('h2',  {class:'news-card-title', text: n.title || ''}),
    el('p',   {class:'news-card-content', text: n.content || ''}),
    el('div', {class:'news-card-footer'}, [
      el('span', {text: '✍️ ' + (n.author || 'White News')}),
      el('span', {class:'news-card-readmore', text: 'Читать →'})
    ])
  ]));

  card.addEventListener('click', () => showArticle(n.id));
  card.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      showArticle(n.id);
    }
  });
  return card;
}

async function loadNews(){
  const container = document.getElementById('newsContainer');
  const loading   = document.getElementById('loading');
  const empty     = document.getElementById('empty');

  loading.classList.remove('hidden');
  empty.classList.add('hidden');
  container.replaceChildren();

  try{
    const {data, error} = await client
      .from('news')
      .select('id,title,content,image_url,author,created_at')
      .eq('is_published', true)
      .eq('status', 'published')
      .order('created_at', {ascending: false})
      .limit(200);

    if(error) throw error;

    loading.classList.add('hidden');
    allNews = Array.isArray(data) ? data : [];

    if(allNews.length === 0){
      empty.classList.remove('hidden');
      return;
    }

    const frag = document.createDocumentFragment();
    for(const n of allNews) frag.appendChild(buildCard(n));
    container.appendChild(frag);
  }catch(err){
    console.error(err);
    loading.replaceChildren(el('p', {class:'text-error', text: 'Ошибка загрузки новостей'}));
  }
}

// ---------- Локальный rate limit (defense in depth) ----------
function checkLocalRateLimit(){
  try{
    const now = Date.now();
    const times = JSON.parse(localStorage.getItem(RATE_KEY) || '[]')
      .filter(t => typeof t === 'number' && now - t < RATE_WINDOW_MS);
    if(times.length >= RATE_MAX) return false;
    times.push(now);
    localStorage.setItem(RATE_KEY, JSON.stringify(times));
    return true;
  }catch(_){ return true; }
}

// ---------- Turnstile ----------
function initTurnstile(){
  if(!window.turnstile) return;
  if(!TURNSTILE_SITE_KEY || TURNSTILE_SITE_KEY.startsWith('REPLACE_')) return;
  turnstileWidgetId = window.turnstile.render('#turnstile-container', {
    sitekey: TURNSTILE_SITE_KEY,
    callback: (token) => { turnstileToken = token; },
    'expired-callback': () => { turnstileToken = null; },
    'error-callback': () => { turnstileToken = null; }
  });
}

// ---------- Форма ----------
const proposeForm  = document.getElementById('proposeForm');
const proposeAlert = document.getElementById('proposeAlert');
const pSubmit      = document.getElementById('pSubmit');

function setAlert(kind, message){
  proposeAlert.className = 'alert alert-' + kind + ' active';
  proposeAlert.textContent = message;
}
function clearAlert(){
  proposeAlert.className = 'alert';
  proposeAlert.textContent = '';
}

proposeForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAlert();

  // Honeypot
  if(document.getElementById('pWebsite').value){ return; }

  // Слишком быстрое заполнение = бот
  if(Date.now() - formOpenedAt < MIN_FILL_TIME_MS){
    setAlert('error', 'Пожалуйста, заполните форму внимательнее.');
    return;
  }

  const title    = document.getElementById('pTitle').value.trim();
  const content  = document.getElementById('pContent').value.trim();
  const imageRaw = document.getElementById('pImage').value.trim();
  const author   = document.getElementById('pAuthor').value.trim();

  if(title.length < 3 || title.length > 200){
    setAlert('error', 'Заголовок должен быть от 3 до 200 символов.'); return;
  }
  if(content.length < 10 || content.length > 20000){
    setAlert('error', 'Текст должен быть от 10 до 20 000 символов.'); return;
  }
  if(author.length > 100){
    setAlert('error', 'Имя слишком длинное.'); return;
  }
  let imageUrl = null;
  if(imageRaw){
    imageUrl = safeHttpsUrl(imageRaw);
    if(!imageUrl){
      setAlert('error', 'Ссылка на картинку должна начинаться с https://'); return;
    }
  }

  if(!TURNSTILE_SITE_KEY.startsWith('REPLACE_') && !turnstileToken){
    setAlert('error', 'Пожалуйста, пройдите проверку капчи.'); return;
  }

  if(!checkLocalRateLimit()){
    setAlert('error', 'Слишком много отправок. Попробуйте позже.'); return;
  }

  pSubmit.disabled = true;
  pSubmit.textContent = 'Отправка...';

  try{
    const res = await fetch(SUBMIT_ENDPOINT, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_PUBLISHABLE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_PUBLISHABLE_KEY
      },
      body: JSON.stringify({
        title, content, image_url: imageUrl, author,
        website: '',
        turnstile_token: turnstileToken
      })
    });

    if(res.status === 429){
      setAlert('error', 'Слишком много отправок. Попробуйте позже.'); return;
    }
    if(!res.ok){
      setAlert('error', 'Не удалось отправить. Попробуйте позже.'); return;
    }

    setAlert('success', '✓ Спасибо! Ваша статья отправлена на модерацию.');
    proposeForm.reset();
    if(turnstileWidgetId !== null && window.turnstile){
      window.turnstile.reset(turnstileWidgetId);
      turnstileToken = null;
    }
    formOpenedAt = Date.now();
    setTimeout(clearAlert, 5000);
  }catch(err){
    console.error(err);
    setAlert('error', 'Не удалось отправить. Попробуйте позже.');
  }finally{
    pSubmit.disabled = false;
    pSubmit.textContent = 'Отправить на модерацию';
  }
});

// ---------- Навигация ----------
document.getElementById('logoBtn').addEventListener('click', showFeed);
document.getElementById('feedBtn').addEventListener('click', showFeed);
document.getElementById('proposeBtn').addEventListener('click', showPropose);
document.getElementById('backBtn').addEventListener('click', showFeed);

window.addEventListener('load', initTurnstile);
loadNews();
</script>
</body>
</html>
